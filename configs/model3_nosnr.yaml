# configs/model3_nosnr.yaml
# ----------------------------
# Stage 3 ABLATION: Frozen Model 2d base + SwinIR refiner WITHOUT SNR conditioning.
#
# Same as model3_swinir.yaml but with use_snr=false (refiner="swinir_nosnr").
# Tests whether FiLM SNR conditioning actually helps.
# Trainable params: 658,803 (SwinIR only, no FiLM MLP)

model:
  name: "SwinRefineJSCC"
  channel: "awgn"

  # Base model (frozen)
  base_config:      "configs/model2d.yaml"
  base_checkpoint:  "checkpoints/model2d/best.pt"

  # Refiner type
  refiner:          "swinir_nosnr"

  # SwinIR hyperparameters (same architecture as primary)
  swinir_embed_dim:  60
  swinir_depths:     [4, 4, 4, 4]
  swinir_num_heads:  [6, 6, 6, 6]
  swinir_window_size: 8

  # No FiLM (refiner is swinir_nosnr)
  film_at_rstb:      false

  # Random channel sampling during training
  random_channel:    false

training:
  seed:         42
  epochs:       15
  patience:     5
  batch_size:   64
  num_workers:  2

  # Identical recipe across refiners
  amp:          true             # FP16 mixed precision autocast for training step
  crop_size:    32               # Synchronized 32x32 random crop for refiner training (val/test on 64x64)
  augment:      true
  weight_decay: 1.0e-4

  optimizer:    "adam"
  lr:           1.0e-4
  lr_swinir:    1.0e-4

  scheduler:    "cosine"
  lr_min:       1.0e-6
  loss:         "mse"

  snr_min:      0.0
  snr_max:      20.0

data:
  root:         "./data"
  download:     true

checkpoints:
  dir:          "./checkpoints/model3_nosnr"
  save_every:   5

logging:
  log_dir:      "./results/model3_nosnr"
  eval_snrs:    [0, 5, 10, 15, 20]
  eval_channels: ["awgn", "rayleigh"]
