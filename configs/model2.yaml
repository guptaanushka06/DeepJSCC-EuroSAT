# configs/model2.yaml
# -------------------
# Configuration for Model 2: ResNet-18 + DeepJSCC + CNN Decoder (no SwinIR)
# Run with:  python train.py --config configs/model2.yaml

model:
  name: "ResNetJSCC"
  channel: "awgn"         # training channel; eval tests AWGN and Rayleigh

training:
  seed:        42
  epochs:      80
  batch_size:  64
  num_workers: 2           # set to 0 if Colab multiprocessing issues occur

  # SNR range for random-SNR training (samples uniformly per batch)
  snr_min:  0.0            # dB
  snr_max: 20.0            # dB

  # Optimizer — only JSCC encoder/decoder and CNN decoder are trained.
  # ResNet-18 backbone is frozen (no gradient).
  optimizer:    "adam"
  lr:           1.0e-3     # for JSCC encoder, decoder, and CNN decoder
  weight_decay: 0.0

  # LR schedule: cosine annealing to lr_min
  scheduler: "cosine"
  lr_min:    1.0e-5

  # Loss
  loss: "mse"

data:
  root:     "./data"
  download: true

checkpoints:
  dir:        "./checkpoints/model2"
  save_every: 10

logging:
  log_dir:       "./results/model2"
  eval_snrs:     [0, 5, 10, 15, 20]      # dB
  eval_channels: ["awgn", "rayleigh"]
