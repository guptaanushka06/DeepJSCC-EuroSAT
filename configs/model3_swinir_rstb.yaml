# configs/model3_swinir_rstb.yaml
# ---------------------------------
# Stage 3 ABLATION: Frozen Model 2d base + SwinIR with FiLM at EVERY RSTB output.
#
# Same as model3_swinir.yaml but with film_at_rstb: true.
# Tests whether deeper FiLM injection (at each of the 4 RSTB blocks)
# improves SNR adaptation beyond the initial-feature-only variant.

model:
  name: "SwinRefineJSCC"
  channel: "awgn"

  # Base model (frozen)
  base_config:      "configs/model2d.yaml"
  base_checkpoint:  "checkpoints/model2d/best.pt"

  # Refiner type
  refiner:          "swinir"

  # SwinIR hyperparameters
  swinir_embed_dim:  60
  swinir_depths:     [4, 4, 4, 4]
  swinir_num_heads:  [6, 6, 6, 6]
  swinir_window_size: 8

  # FiLM at initial + every RSTB output
  film_at_rstb:      true

  random_channel:    false

training:
  seed:         42
  epochs:       15
  patience:     5
  batch_size:   64
  num_workers:  2

  amp:          true
  crop_size:    32
  augment:      true
  weight_decay: 1.0e-4

  optimizer:    "adam"
  lr:           1.0e-4
  lr_swinir:    1.0e-4

  scheduler:    "cosine"
  lr_min:       1.0e-6
  loss:         "mse"

  snr_min:      0.0
  snr_max:      20.0

data:
  root:         "./data"
  download:     true

checkpoints:
  dir:          "./checkpoints/model3_swinir_rstb"
  save_every:   5

logging:
  log_dir:      "./results/model3_swinir_rstb"
  eval_snrs:    [0, 5, 10, 15, 20]
  eval_channels: ["awgn", "rayleigh"]
